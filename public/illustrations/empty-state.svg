<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" width="100%" height="100%">
  <circle cx="200" cy="150" r="100" fill="#F8F3EB" />
  
  <!-- Empty Folder / Box -->
  <rect x="130" y="110" width="140" height="95" rx="12" fill="#FFFFFF" stroke="#020C2B" stroke-width="2.5" />
  <path d="M130 135 H270" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Magnifying glass looking inside -->
  <g transform="translate(190, 115)">
    <circle cx="30" cy="30" r="24" stroke="#E58145" stroke-width="4" fill="#FFFFFF" opacity="0.9" />
    <line x1="47" y1="47" x2="68" y2="68" stroke="#020C2B" stroke-width="5" stroke-linecap="round" />
    <!-- Question mark -->
    <text x="30" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#020C2B">?</text>
  </g>
</svg>
