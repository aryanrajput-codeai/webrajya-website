<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Background soft circular glow -->
  <circle cx="250" cy="175" r="130" fill="#F8F3EB" />
  
  <!-- Desk line -->
  <path d="M60 280 H440" stroke="#020C2B" stroke-width="4" stroke-linecap="round" />
  
  <!-- Fast Speed lines -->
  <path d="M120 140 H80" stroke="#E58145" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M140 160 H90" stroke="#E58145" stroke-width="4" stroke-linecap="round" />
  <path d="M110 180 H70" stroke="#E58145" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  
  <!-- Floating Invoice Card (Center) -->
  <g transform="rotate(-3 250 170)">
    <rect x="180" y="80" width="150" height="190" rx="14" fill="#FFFFFF" stroke="#020C2B" stroke-width="3" filter="drop-shadow(0 14px 24px rgba(2,12,43,0.12))" />
    
    <!-- Header band -->
    <rect x="195" y="98" width="60" height="10" rx="5" fill="#020C2B" />
    <rect x="195" y="116" width="120" height="2" fill="#E2E8F0" />
    
    <!-- Item lines -->
    <rect x="195" y="130" width="70" height="7" rx="3" fill="#E2E8F0" />
    <rect x="290" y="130" width="25" height="7" rx="3" fill="#020C2B" />
    
    <rect x="195" y="146" width="60" height="7" rx="3" fill="#E2E8F0" />
    <rect x="290" y="146" width="25" height="7" rx="3" fill="#020C2B" />
    
    <rect x="195" y="162" width="80" height="7" rx="3" fill="#E2E8F0" />
    <rect x="290" y="162" width="25" height="7" rx="3" fill="#020C2B" />
    
    <!-- Total Section -->
    <rect x="195" y="185" width="120" height="34" rx="8" fill="#F8F3EB" />
    <text x="205" y="206" font-family="sans-serif" font-size="11" font-weight="bold" fill="#020C2B">TOTAL</text>
    <text x="270" y="206" font-family="monospace" font-size="12" font-weight="900" fill="#E58145">₹1,850</text>
    
    <!-- Barcode at bottom -->
    <line x1="200" y1="236" x2="200" y2="250" stroke="#020C2B" stroke-width="2" />
    <line x1="205" y1="236" x2="205" y2="250" stroke="#020C2B" stroke-width="4" />
    <line x1="213" y1="236" x2="213" y2="250" stroke="#020C2B" stroke-width="1.5" />
    <line x1="218" y1="236" x2="218" y2="250" stroke="#020C2B" stroke-width="3" />
    <line x1="225" y1="236" x2="225" y2="250" stroke="#020C2B" stroke-width="2" />
    <line x1="231" y1="236" x2="231" y2="250" stroke="#020C2B" stroke-width="3" />
    <line x1="238" y1="236" x2="238" y2="250" stroke="#020C2B" stroke-width="1.5" />
    <line x1="243" y1="236" x2="243" y2="250" stroke="#020C2B" stroke-width="4" />
  </g>
  
  <!-- Sub-3s Stopwatch Badge (Right) -->
  <g transform="translate(340, 110)">
    <circle cx="35" cy="35" r="32" fill="#E58145" stroke="#FFFFFF" stroke-width="3" filter="drop-shadow(0 6px 16px rgba(229,129,69,0.35))" />
    <!-- Clock hand at 3 sec -->
    <path d="M35 15 V35 L48 24" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <text x="35" y="54" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">&lt; 3 SEC</text>
  </g>
  
  <!-- Floating Coins -->
  <circle cx="160" cy="110" r="14" fill="#E58145" />
  <circle cx="160" cy="110" r="10" fill="#FFFFFF" opacity="0.3" />
  <text x="160" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">₹</text>
  
  <circle cx="140" cy="220" r="11" fill="#020C2B" />
  <text x="140" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">₹</text>
</svg>
