<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Background soft halo -->
  <circle cx="250" cy="175" r="140" fill="#F8F3EB" />
  <circle cx="250" cy="175" r="100" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Desk/Base line -->
  <path d="M70 280 H430" stroke="#020C2B" stroke-width="4" stroke-linecap="round" />
  
  <!-- Central Billing Terminal / Computer Screen -->
  <rect x="160" y="90" width="180" height="130" rx="16" fill="#020C2B" />
  <rect x="172" y="102" width="156" height="106" rx="10" fill="#FFFFFF" />
  
  <!-- Screen Interface Elements -->
  <rect x="184" y="116" width="60" height="8" rx="4" fill="#E58145" />
  <rect x="184" y="132" width="132" height="6" rx="3" fill="#E2E8F0" />
  <rect x="184" y="144" width="90" height="6" rx="3" fill="#E2E8F0" />
  <rect x="184" y="156" width="110" height="6" rx="3" fill="#E2E8F0" />
  
  <!-- Green check badge on screen -->
  <circle cx="296" cy="184" r="14" fill="#10B981" />
  <path d="M290 184 L294 188 L302 180" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stand & Base -->
  <rect x="235" y="220" width="30" height="40" fill="#020C2B" />
  <ellipse cx="250" cy="260" rx="40" ry="8" fill="#020C2B" />
  
  <!-- Thermal Printer (Left) -->
  <rect x="90" y="195" width="60" height="65" rx="8" fill="#020C2B" />
  <rect x="100" y="205" width="40" height="12" rx="3" fill="#E58145" />
  <!-- Receipt Paper feed -->
  <path d="M104 195 V165 L110 170 L116 165 L122 170 L128 165 L134 170 L136 165 V195 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="110" y1="178" x2="130" y2="178" stroke="#020C2B" stroke-width="2" stroke-linecap="round" />
  <line x1="110" y1="184" x2="124" y2="184" stroke="#020C2B" stroke-width="2" stroke-linecap="round" />
  
  <!-- Barcode Scanner (Right) -->
  <path d="M360 210 Q375 180 395 190 Q410 200 400 230 L385 260 H365 Z" fill="#E58145" />
  <rect x="365" y="258" width="28" height="6" rx="3" fill="#020C2B" />
  <!-- Scan Laser beam -->
  <line x1="355" y1="195" x2="310" y2="195" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 2" />
  
  <!-- Subtle decorative stars -->
  <path d="M140 100 L144 110 L154 114 L144 118 L140 128 L136 118 L126 114 L136 110 Z" fill="#E58145" opacity="0.8" />
  <path d="M370 120 L373 128 L381 131 L373 134 L370 142 L367 134 L359 131 L367 128 Z" fill="#020C2B" opacity="0.3" />
</svg>
