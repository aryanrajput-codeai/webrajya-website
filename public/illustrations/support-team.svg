<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Background soft circle -->
  <circle cx="250" cy="175" r="130" fill="#F8F3EB" />
  
  <!-- Desk Base -->
  <path d="M80 280 H420" stroke="#020C2B" stroke-width="4" stroke-linecap="round" />
  
  <!-- Customer Support Specialist Figure -->
  <circle cx="250" cy="120" r="32" fill="#E58145" />
  
  <!-- Headset -->
  <path d="M218 120 C218 90 282 90 282 120" stroke="#020C2B" stroke-width="4" stroke-linecap="round" fill="none" />
  <rect x="214" y="112" width="8" height="18" rx="4" fill="#020C2B" />
  <rect x="278" y="112" width="8" height="18" rx="4" fill="#020C2B" />
  <!-- Microphone -->
  <path d="M220 126 C220 145 235 145 244 140" stroke="#020C2B" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="245" cy="140" r="4" fill="#020C2B" />
  
  <!-- Body / Torso -->
  <path d="M200 240 C200 175 300 175 300 240 Z" fill="#020C2B" />
  
  <!-- Laptop on desk in front -->
  <rect x="210" y="215" width="80" height="50" rx="6" fill="#FFFFFF" stroke="#020C2B" stroke-width="2.5" />
  <path d="M190 265 H310 L300 270 H200 Z" fill="#020C2B" />
  
  <!-- Speech Bubble with Heart / Smile -->
  <g transform="translate(310, 80)">
    <rect x="0" y="0" width="80" height="50" rx="14" fill="#FFFFFF" stroke="#020C2B" stroke-width="2.5" filter="drop-shadow(0 6px 14px rgba(2,12,43,0.1))" />
    <polygon points="15,50 25,60 30,50" fill="#FFFFFF" />
    <path d="M15 50 L25 60 L30 50" stroke="#020C2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M30 25 C30 20 40 18 40 25 C40 18 50 20 50 25 C50 32 40 37 40 37 C40 37 30 32 30 25 Z" fill="#E58145" />
  </g>
  
  <!-- Location Pin badge (Jabalpur) -->
  <g transform="translate(110, 100)">
    <circle cx="24" cy="24" r="22" fill="#020C2B" />
    <circle cx="24" cy="20" r="6" fill="#E58145" />
    <path d="M16 20 C16 27 24 35 24 35 C24 35 32 27 32 20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
