<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020C2B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Circle Accents -->
  <path d="M 220 30 A 215 215 0 0 1 450 215" fill="none" stroke="#061329" stroke-width="12" stroke-linecap="round" />
  <path d="M 50 240 A 215 215 0 0 1 180 34" fill="none" stroke="#061329" stroke-width="12" stroke-linecap="round" />

  <path d="M 458 245 A 215 215 0 0 1 200 460" fill="none" stroke="#F36F21" stroke-width="14" stroke-linecap="round" />
  <path d="M 52 260 A 215 215 0 0 0 180 456" fill="none" stroke="#F36F21" stroke-width="14" stroke-linecap="round" />

  <!-- Top Cloche / Dish Cover Group -->
  <g id="cloche-group">
    <!-- Steam lines -->
    <path d="M 235 55 C 228 72 242 82 235 95" fill="none" stroke="#061329" stroke-width="5" stroke-linecap="round" />
    <path d="M 255 48 C 248 68 262 78 255 95" fill="none" stroke="#061329" stroke-width="5" stroke-linecap="round" />
    <path d="M 275 55 C 268 72 282 82 275 95" fill="none" stroke="#061329" stroke-width="5" stroke-linecap="round" />

    <!-- Cloche Knob -->
    <circle cx="255" cy="106" r="7.5" fill="#061329" />

    <!-- Cloche Dome -->
    <path d="M 200 162 C 200 115 310 115 310 162 Z" fill="#061329" />

    <!-- Cloche Tray Base Bar -->
    <rect x="190" y="162" width="130" height="11" rx="5.5" fill="#061329" />

    <!-- Speed / Heat Lines (Orange) -->
    <path d="M 330 124 H 410" fill="none" stroke="#F36F21" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 335 140 H 435" fill="none" stroke="#F36F21" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 330 156 H 400" fill="none" stroke="#F36F21" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- Central Initials "W R" -->
  <path d="M 100 185 L 145 350 L 195 240 L 245 350 L 285 185" fill="none" stroke="#061329" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 315 200 V 400 M 315 200 H 370 C 412 200 412 290 370 290 H 315 M 360 290 L 415 400" fill="none" stroke="#F36F21" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Receipt / Menu Icon -->
  <g id="receipt-icon" filter="url(#shadow)">
    <rect x="210" y="360" width="80" height="90" rx="8" fill="#061329" />
    <circle cx="230" cy="378" r="6" fill="#F36F21" />

    <line x1="244" y1="378" x2="274" y2="378" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="226" y1="395" x2="274" y2="395" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="226" y1="410" x2="274" y2="410" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="226" y1="425" x2="260" y2="425" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

    <path d="M 200 442 C 230 462 270 462 300 442 C 270 454 230 454 200 442 Z" fill="#F36F21" />
  </g>
</svg>
